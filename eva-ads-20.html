<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EVA ADS</title>
<style>
  :root{
    --bg: #060607;
    --ink: #f5f5f7;
    --ink-dim: rgba(245,245,247,0.72);
    --ink-faint: rgba(245,245,247,0.46);
    --accent-a: #ff3b5c;   /* coral-red glow */
    --accent-b: #23e6d8;   /* cyan glow */
    --line: rgba(255,255,255,0.14);
    --panel: rgba(20,20,22,0.72);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    overscroll-behavior:none;
  }
  #app{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    max-width:480px;
    margin:0 auto;
    overflow:hidden;
    background:#000;
  }

  /* ---------- Feed ---------- */
  #feed{
    height:100%;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
  }
  #feed::-webkit-scrollbar{display:none;}

  .slide{
    position:relative;
    height:100%;
    width:100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
    background:#000;
  }
  .slide video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
  }
  .slide::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:46%;
    background:linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0) 100%);
    pointer-events:none;
  }
  .slide::before{
    content:"";
    position:absolute;
    left:0; right:0; top:0;
    height:18%;
    background:linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0) 100%);
    pointer-events:none;
    z-index:1;
  }

  /* double-tap heart burst */
  .heart-burst{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0);
    font-size:110px;
    z-index:5;
    pointer-events:none;
    filter: drop-shadow(0 4px 18px rgba(255,59,92,0.55));
  }
  .heart-burst.pop{
    animation: heartPop 0.75s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes heartPop{
    0%{ transform:translate(-50%,-50%) scale(0); opacity:0; }
    18%{ transform:translate(-50%,-50%) scale(1.15); opacity:1; }
    35%{ transform:translate(-50%,-50%) scale(0.95); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1); opacity:0; }
  }

  /* ---------- Caption block ---------- */
  .meta{
    position:relative;
    z-index:2;
    padding: 0 78px 92px 16px;
    width:100%;
  }
  .handle{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:15.5px;
    margin-bottom:8px;
    letter-spacing:0.1px;
  }
  .handle .dot-sep{ color:var(--ink-faint); font-weight:400; }
  .sponsored-tag{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-faint);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:4px;
    padding:1px 6px;
  }
  .cta-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    padding:10px 18px;
    border-radius:8px;
    border:none;
    font-size:14px;
    font-weight:700;
    color:#06070a;
    background:linear-gradient(90deg, var(--accent-b), var(--accent-a));
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
  }
  .follow-chip{
    border:1.4px solid var(--ink);
    color:var(--ink);
    background:transparent;
    border-radius:5px;
    font-size:12.5px;
    font-weight:700;
    padding:2px 9px;
    cursor:pointer;
  }
  .caption{
    font-size:14.5px;
    line-height:1.42;
    color:var(--ink);
    margin-bottom:10px;
    max-width:78%;
  }
  .caption .tag{ color:var(--accent-b); font-weight:600; }
  .sound-row{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:var(--ink-dim);
    overflow:hidden;
    white-space:nowrap;
  }
  .sound-row svg{ flex-shrink:0; }
  .sound-track{
    display:inline-block;
    animation: marquee 9s linear infinite;
  }

  @keyframes marquee{
    0%{ transform:translateX(0%); }
    100%{ transform:translateX(-50%); }
  }

  /* ---------- Right action rail ---------- */
  .rail{
    position:absolute;
    right:10px;
    bottom:100px;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:19px;
  }
  .rail-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    cursor:pointer;
    background:none;
    border:none;
    color:var(--ink);
  }
  .rail-icon{
    width:46px; height:46px;
    display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .rail-count{
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    text-shadow:0 1px 4px rgba(0,0,0,0.6);
  }
  .rail-item.liked .rail-count{ color:var(--accent-a); }
  .rail-item svg{ transition: transform .25s cubic-bezier(.3,1.7,.4,1); }
  .rail-item.bump svg{ transform:scale(1.35); }

  .avatar-stack{
    position:relative;
    width:46px; height:52px;
    margin-bottom:4px;
  }
  .avatar-stack img{
    width:44px; height:44px;
    border-radius:50%;
    border:2px solid var(--ink);
    object-fit:cover;
    display:block;
  }
  .avatar-plus{
    position:absolute;
    bottom:-6px; left:50%;
    transform:translateX(-50%);
    width:19px; height:19px;
    border-radius:50%;
    background:var(--accent-a);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; line-height:0;
    border:2px solid var(--bg);
  }

  .disc{
    width:44px; height:44px;
    border-radius:50%;
    margin-top:2px;
    background: conic-gradient(from 90deg, #333, #111 40%, #333);
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,0.25);
    animation: spin 3.6s linear infinite;
    overflow:hidden;
  }
  .disc img{ width:100%; height:100%; object-fit:cover; border-radius:50%; opacity:.85;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Top bar ---------- */
  /* ---------- Auth screen (sign up / log in) ---------- */
  .auth-screen{
    position:absolute;
    inset:0;
    z-index:30;
    background:#08080a;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-y:auto;
  }
  .auth-screen.hide{ display:none; }
  .auth-wrap{
    width:100%;
    max-width:340px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .auth-logo{
    margin-bottom:22px;
    display:flex;
    justify-content:center;
  }
  .auth-logo img{
    width:150px;
    height:auto;
    display:block;
  }
  .auth-tabs{
    display:flex;
    width:100%;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
  }
  .auth-tab{
    flex:1;
    background:none;
    border:none;
    color:var(--ink-faint);
    font-size:15px;
    font-weight:700;
    padding:0 0 12px;
    cursor:pointer;
    position:relative;
  }
  .auth-tab.active{ color:var(--ink); }
  .auth-tab.active::after{
    content:"";
    position:absolute;
    bottom:-1px; left:0; right:0;
    height:2px;
    background:var(--ink);
  }
  .auth-form{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .auth-input{
    width:100%;
    background:#17171a;
    border:1px solid var(--line);
    border-radius:8px;
    padding:13px 14px;
    color:var(--ink);
    font-size:14.5px;
  }
  .auth-input:focus{ outline:1.4px solid #a04bd6; }
  .auth-error{
    color:var(--accent-a);
    font-size:12.5px;
    min-height:14px;
    margin:0;
  }
  .auth-submit{
    width:100%;
    padding:13px;
    border-radius:8px;
    border:none;
    font-size:15px;
    font-weight:800;
    color:#fff;
    background:linear-gradient(90deg, #c026e8, #6d28d9);
    cursor:pointer;
    margin-top:4px;
  }
  .auth-switch{
    margin-top:22px;
    font-size:13.5px;
    color:var(--ink-faint);
    display:flex;
    gap:6px;
  }
  .auth-switch button{
    background:none;
    border:none;
    color:#c94bf0;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
  }
  .auth-guest{
    margin-top:24px;
    background:none;
    border:none;
    color:var(--ink-faint);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
  }

  .topbar{
    position:absolute;
    top:0; left:0; right:0;
    z-index:4;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:16px 16px 10px;
  }
  .brandmark{
    position:absolute;
    left:14px;
    top:12px;
    z-index:4;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .brandmark img{
    height:26px;
    width:auto;
    display:block;
  }
  .brandmark-word{
    height:15px !important;
  }
  .topbar .tab{
    font-size:16px;
    font-weight:600;
    color:var(--ink-faint);
    background:none; border:none;
    padding-bottom:6px;
    position:relative;
    cursor:pointer;
  }
  .topbar .tab.active{ color:var(--ink); font-weight:700; }
  .topbar .tab.active::after{
    content:"";
    position:absolute;
    bottom:0; left:50%;
    transform:translateX(-50%);
    width:22px; height:3px;
    border-radius:3px;
    background:var(--ink);
  }
  .topbar-right{
    position:absolute;
    right:14px;
    top:14px;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .search-icon-btn{
    background:none;
    border:none;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2px;
    cursor:pointer;
  }
  .coin-chip{
    display:flex;
    align-items:center;
    gap:5px;
    background:rgba(0,0,0,0.4);
    border:1px solid rgba(255,204,51,0.5);
    border-radius:14px;
    padding:5px 10px 5px 7px;
    color:#ffcc33;
    font-size:13px;
    font-weight:800;
  }

  /* progress dash */
  .progress{
    position:absolute;
    left:14px; right:14px; bottom:66px;
    height:2px;
    background:rgba(255,255,255,0.22);
    border-radius:2px;
    z-index:3;
    overflow:hidden;
  }
  .progress > i{
    display:block;
    height:100%;
    width:0%;
    background:var(--ink);
    border-radius:2px;
  }

  /* mute toggle */
  /* ---------- Search screen ---------- */
  /* ---------- Category dropdown ---------- */
  .category-dropdown{
    position:absolute;
    top:46px;
    left:50%;
    transform:translateX(-50%);
    z-index:9;
    background:#141416;
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px;
    display:none;
    flex-direction:column;
    min-width:150px;
    box-shadow:0 10px 24px rgba(0,0,0,0.55);
  }
  .category-dropdown.show{ display:flex; }
  .category-option{
    background:none;
    border:none;
    color:var(--ink);
    text-align:left;
    padding:9px 12px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .category-option:hover{ background:rgba(255,255,255,0.06); }
  .category-option.active{ background:rgba(196,75,240,0.16); color:#d68bf5; }

  .search-screen{
    position:absolute;
    inset:0;
    z-index:25;
    background:var(--bg);
    display:none;
    flex-direction:column;
  }
  .search-screen.show{ display:flex; }
  .search-bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px;
    border-bottom:1px solid var(--line);
  }
  .search-input-wrap{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    background:#1c1c1f;
    border-radius:20px;
    padding:9px 14px;
    color:var(--ink-faint);
  }
  .search-input{
    flex:1;
    background:none;
    border:none;
    color:var(--ink);
    font-size:14.5px;
  }
  .search-input:focus{ outline:none; }
  .search-cancel{
    background:none;
    border:none;
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .search-results{
    flex:1;
    overflow-y:auto;
    padding:6px 14px;
  }
  .search-empty{
    color:var(--ink-faint);
    font-size:13.5px;
    text-align:center;
    margin-top:40px;
  }
  .search-result-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .search-result-item img{
    width:46px; height:64px;
    object-fit:cover;
    border-radius:6px;
    background:#111;
  }
  .search-result-text{ display:flex; flex-direction:column; gap:3px; overflow:hidden; }
  .search-result-user{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .search-result-caption{
    font-size:12.5px;
    color:var(--ink-faint);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .mute-btn{
    position:absolute;
    top:64px; right:14px;
    z-index:4;
    width:34px; height:34px;
    border-radius:50%;
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
  }

  /* ---------- Floating ad box ---------- */
  .ad-box{
    position:absolute;
    top:64px;
    left:12px;
    z-index:7;
    width:104px;
    border-radius:10px;
    overflow:hidden;
    background:#0c0c0d;
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 8px 20px rgba(0,0,0,0.5);
  }
  .ad-box.hidden{ display:none; }
  .ad-box video{
    width:100%;
    height:132px;
    object-fit:cover;
    display:block;
    background:#000;
  }
  .ad-box-tag{
    position:absolute;
    top:5px; left:5px;
    z-index:2;
    background:rgba(0,0,0,0.65);
    color:var(--ink-dim);
    font-size:9.5px;
    font-weight:700;
    padding:1px 5px;
    border-radius:3px;
    letter-spacing:0.4px;
  }
  .ad-box-info{
    padding:6px 7px 8px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .ad-box-brand{
    font-size:10.5px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ad-box-cta{
    width:100%;
    padding:5px 0;
    border-radius:6px;
    border:none;
    font-size:10.5px;
    font-weight:800;
    color:#06070a;
    background:linear-gradient(90deg, var(--accent-b), var(--accent-a));
    cursor:pointer;
  }

  /* ---------- Bottom nav ---------- */
  /* ---------- Profile view ---------- */
  .profile-view{
    position:absolute;
    inset:0;
    z-index:6;
    background:var(--bg);
    display:none;
    flex-direction:column;
    overflow-y:auto;
  }
  .profile-view.show{ display:flex; }
  .profile-top{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px 0 10px;
    border-bottom:1px solid var(--line);
  }
  .profile-back{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
    cursor:pointer;
  }
  .profile-settings{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
    cursor:pointer;
  }
  .profile-title{ font-size:16px; font-weight:700; }
  .profile-body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:26px 20px 100px;
  }
  .profile-avatar{
    width:88px; height:88px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--line);
  }
  .profile-name{ font-size:18px; font-weight:800; margin-top:12px; }
  .profile-handle{ font-size:13px; color:var(--ink-faint); margin-top:2px; }

  .profile-stats{
    display:flex;
    gap:44px;
    margin-top:22px;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; }
  .stat-num{ font-size:20px; font-weight:800; }
  .stat-num.coin{ color:#ffcc33; }
  .stat-label{ font-size:12px; color:var(--ink-faint); margin-top:3px; }

  .withdraw-btn{
    margin-top:20px;
    padding:10px 26px;
    border-radius:8px;
    border:none;
    font-size:14px;
    font-weight:700;
    color:#06070a;
    background:#ffcc33;
    cursor:pointer;
  }

  .coin-earned{
    position:absolute;
    top:30%; left:50%;
    transform:translate(-50%,0);
    z-index:6;
    background:rgba(0,0,0,0.55);
    border:1px solid rgba(255,204,51,0.6);
    color:#ffcc33;
    font-weight:800;
    font-size:15px;
    padding:6px 14px;
    border-radius:16px;
    pointer-events:none;
    animation: coinFloat 1.2s ease-out forwards;
  }
  @keyframes coinFloat{
    0%{ opacity:0; transform:translate(-50%,10px); }
    20%{ opacity:1; transform:translate(-50%,0); }
    75%{ opacity:1; transform:translate(-50%,-14px); }
    100%{ opacity:0; transform:translate(-50%,-26px); }
  }

  .ad-coin-earned{
    position:absolute;
    top:210px;
    left:64px;
    transform:translate(-50%,0);
    z-index:8;
    background:rgba(0,0,0,0.6);
    border:1px solid rgba(255,204,51,0.6);
    color:#ffcc33;
    font-weight:800;
    font-size:13px;
    padding:5px 12px;
    border-radius:14px;
    pointer-events:none;
    white-space:nowrap;
    animation: coinFloat 1.2s ease-out forwards;
  }

  .edit-profile-btn{
    margin-top:14px;
    padding:7px 22px;
    border-radius:6px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  /* ---------- Edit profile modal ---------- */
  .edit-modal{
    position:absolute;
    inset:0;
    z-index:10;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:flex-end;
  }
  .edit-modal.show{ display:flex; }
  .edit-sheet{
    width:100%;
    background:#111113;
    border-radius:16px 16px 0 0;
    padding:14px 20px calc(24px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .edit-sheet-head{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
    margin-bottom:20px;
  }
  .edit-title{ font-size:15px; font-weight:700; }
  .edit-cancel{ background:none; border:none; color:var(--ink-faint); font-size:14px; cursor:pointer; }
  .edit-save{ background:none; border:none; color:var(--accent-b); font-size:14px; font-weight:700; cursor:pointer; }

  .edit-photo-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .edit-avatar-preview{
    width:84px; height:84px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--line);
  }
  .edit-photo-btn{
    background:none;
    border:none;
    color:var(--accent-b);
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }

  .edit-field-label{
    width:100%;
    font-size:12px;
    color:var(--ink-faint);
    margin-bottom:6px;
  }
  .edit-name-input{
    width:100%;
    background:#1c1c1f;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    color:var(--ink);
    font-size:14.5px;
  }
  .edit-name-input:focus{ outline:1.4px solid var(--accent-b); }

  .settings-list{
    width:100%;
    display:flex;
    flex-direction:column;
  }
  .settings-item{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:none;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--ink);
    font-size:14.5px;
    font-weight:600;
    padding:15px 2px;
    cursor:pointer;
  }
  .settings-item:last-child{ border-bottom:none; }
  .settings-item.danger{ color:var(--accent-a); justify-content:center; margin-top:6px; }

  .account-field{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 2px;
    border-bottom:1px solid var(--line);
  }
  .account-field-label{ font-size:13.5px; color:var(--ink-faint); }
  .account-field-value{ font-size:14px; color:var(--ink); font-weight:600; }
  .verify-status{ font-size:12px; color:var(--ink-faint); }
  .verify-status.verified{ color:#23e6d8; font-weight:700; }
  .account-saved-msg{
    font-size:12.5px;
    color:#23e6d8;
    margin:8px 0 0;
    min-height:14px;
  }

  .display-options{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .display-option{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    background:#141416;
    border:1.4px solid var(--line);
    border-radius:10px;
    padding:12px;
    cursor:pointer;
  }
  .display-option.active{ border-color:#23e6d8; }
  .display-option-swatch{
    width:38px; height:38px;
    border-radius:8px;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,0.15);
  }
  .dark-swatch{ background:#0c0c0d; }
  .light-swatch{ background:#f2f2f4; }
  .display-option-text{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
    text-align:left;
  }
  .display-option-title{ font-size:14px; font-weight:700; color:var(--ink); }
  .display-option-sub{ font-size:12px; color:var(--ink-faint); }
  .display-check{ opacity:0; flex-shrink:0; }
  .display-option.active .display-check{ opacity:1; }

  /* ---------- Light theme (applies to app chrome, not the video feed itself) ---------- */
  #app.light-mode{
    --ink: #16161b;
    --ink-dim: rgba(22,22,27,0.72);
    --ink-faint: rgba(22,22,27,0.46);
    --line: rgba(0,0,0,0.12);
    --panel: rgba(255,255,255,0.9);
  }
  #app.light-mode .profile-view,
  #app.light-mode .auth-screen,
  #app.light-mode .search-screen{
    background:#f7f7f8;
  }
  #app.light-mode .edit-sheet,
  #app.light-mode .category-dropdown{
    background:#ffffff;
  }
  #app.light-mode .auth-input,
  #app.light-mode .edit-name-input,
  #app.light-mode .search-input-wrap,
  #app.light-mode .display-option{
    background:#f0f0f2;
  }
  #app.light-mode .auth-input::placeholder,
  #app.light-mode .edit-name-input::placeholder,
  #app.light-mode .search-input::placeholder{
    color: rgba(22,22,27,0.4);
  }
  #app.light-mode .edit-profile-btn{
    color: var(--ink);
    border-color: var(--line);
  }

  /* Keep everything overlaid on the video feed itself unaffected by theme —
     it sits on top of video content, not app "chrome", so it always needs
     light text/icons regardless of Dark/Light selection. */
  #app.light-mode .topbar,
  #app.light-mode .rail,
  #app.light-mode .meta,
  #app.light-mode .mute-btn,
  #app.light-mode .coin-chip,
  #app.light-mode .search-icon-btn,
  #app.light-mode .ad-box,
  #app.light-mode .progress{
    --ink: #f5f5f7;
    --ink-dim: rgba(245,245,247,0.72);
    --ink-faint: rgba(245,245,247,0.46);
  }

  /* Bottom nav follows the theme: white bar with dark icons in Light mode */
  #app.light-mode .bottomnav{
    background: linear-gradient(to top, rgba(255,255,255,0.97), rgba(255,255,255,0.88) 70%, transparent);
  }

  .bottomnav{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:9px 6px calc(9px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.75) 70%, transparent);
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--ink-faint);
    font-size:10.5px; font-weight:600;
    cursor:pointer;
  }
  .nav-item.active{ color:var(--ink); }
  .nav-add{
    width:60px; height:44px;
    border-radius:9px;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    margin-top:-6px;
    overflow:hidden;
  }
  .nav-add img{
    width:100%; height:100%;
    object-fit:contain;
    position:relative;
    z-index:1;
  }
  .nav-add-wrap{ display:flex; flex-direction:column; align-items:center; }

  @media (min-height: 780px){
    .rail{ bottom:118px; }
  }
</style>
</head>

    const nowLiked = forceLike ? true : !isLiked;
    btn.classList.toggle('liked', nowLiked);
    icon.innerHTML = HEART_SVG(nowLiked, '#ff3b5c');

    if(!countEl.dataset.raw){
      countEl.dataset.raw = rawLikes;

    let raw = parseInt(countEl.dataset.raw);

    let lastTap = 0;

      if(e.target.closest('.rail') || e.target.closest('.meta') || e.target.closest('.mute-btn')) return;

  accountModal.addEventListener('click', (e) => { if(e.target === accountModal) accountModal.classList.remove('show'); });

  acctInfoItem.addEventListener('click', () => {
    accountModal.classList.remove('show');
    acctEmailDisplay.textContent = userEmail || 'Not set';
    acctPhoneInput.value = userPhone;
    acctPhoneSavedMsg.textContent = '';
    accountInfoModal.classList.add('show');
  });
  acctInfoBack.addEventListener('click', () => {
    accountInfoModal.classList.remove('show');
    accountModal.classList.add('show');
  });
  accountInfoModal.addEventListener('click', (e) => { if(e.target === accountInfoModal) accountInfoModal.classList.remove('show'); });

  acctPhoneSave.addEventListener('click', async () => {
    const val = acctPhoneInput.value.trim();
    if(!val){
      acctPhoneSavedMsg.style.color = 'var(--accent-a)';
      acctPhoneSavedMsg.textContent = 'Please enter a phone number.';
      return;
    }
    userPhone = val;
    if(!isGuest && currentUserRef){
      try{
        await updateDoc(currentUserRef, { phone: val });
      } catch(err){
        acctPhoneSavedMsg.style.color = 'var(--accent-a)';
        acctPhoneSavedMsg.textContent = 'Could not save — please try again.';
        return;
      }
    }
    acctPhoneSavedMsg.style.color = '#23e6d8';
    acctPhoneSavedMsg.textContent = 'Phone number saved.';
  });

  function resetVerifySteps(){
    verifyStep1.style.display = 'block';
    verifyStep2.style.display = 'none';
    verifyStep3.style.display = 'none';
    verifySendError.textContent = '';
    verifyError.textContent = '';
    verifyOtpInput.value = '';
    verifyPhoneInput.value = userPhone;
  }

  acctVerifyItem.addEventListener('click', () => {
    accountModal.classList.remove('show');
    if(isVerified){
      verifyStep1.style.display = 'none';
      verifyStep2.style.display = 'none';
      verifyStep3.style.display = 'block';
    } else {
      resetVerifySteps();
    }
    verifyModal.classList.add('show');
  });
  verifyBack.addEventListener('click', () => {
    verifyModal.classList.remove('show');
    accountModal.classList.add('show');
  });
  verifyModal.addEventListener('click', (e) => { if(e.target === verifyModal) verifyModal.classList.remove('show'); });

  verifySendBtn.addEventListener('click', () => {
    const phone = verifyPhoneInput.value.trim();
    if(!phone){
      verifySendError.textContent = 'Please enter a phone number.';
      return;
    }
    verifySendError.textContent = '';
    userPhone = phone;
    currentOtp = String(Math.floor(1000 + Math.random() * 9000));
    verifyOtpHint.textContent = 'Demo code (no real SMS yet): ' + currentOtp;
    verifyStep1.style.display = 'none';
    verifyStep2.style.display = 'block';
    verifyOtpInput.value = '';
    verifyOtpInput.focus();
  });

  verifyConfirmBtn.addEventListener('click', async () => {
    const entered = verifyOtpInput.value.trim();
    if(entered !== currentOtp){
      verifyError.textContent = 'Incorrect code, please try again.';
      return;
    }
    verifyError.textContent = '';
    isVerified = true;
    acctVerifyStatus.textContent = 'Verified';
    acctVerifyStatus.classList.add('verified');
    verifyStep2.style.display = 'none';
    verifyStep3.style.display = 'block';
    if(!isGuest && currentUserRef){
      updateDoc(currentUserRef, { verified: true, phone: userPhone }).catch(()=>{});
    }
  });

  // ---- display (dark / light theme) ----
  const settingsDisplay = document.getElementById('settingsDisplay');
  const displayModal = document.getElementById('displayModal');
  const displayClose = document.getElementById('displayClose');
  const displayStatus = document.getElementById('displayStatus');
  const themeDarkBtn = document.getElementById('themeDarkBtn');
  const themeLightBtn = document.getElementById('themeLightBtn');
  const appRoot = document.getElementById('app');

  settingsDisplay.addEventListener('click', () => {
    settingsModal.classList.remove('show');
    displayModal.classList.add('show');
  });
  displayClose.addEventListener('click', () => displayModal.classList.remove('show'));
  displayModal.addEventListener('click', (e) => { if(e.target === displayModal) displayModal.classList.remove('show'); });

  function setTheme(theme){
    if(theme === 'light'){
      appRoot.classList.add('light-mode');
      themeLightBtn.classList.add('active');
      themeDarkBtn.classList.remove('active');
      displayStatus.textContent = 'Light';
    } else {
      appRoot.classList.remove('light-mode');
      themeDarkBtn.classList.add('active');
      themeLightBtn.classList.remove('active');
      displayStatus.textContent = 'Dark';
    }
  }

  themeDarkBtn.addEventListener('click', () => setTheme('dark'));
  themeLightBtn.addEventListener('click', () => setTheme('light'));

  // ---- auth screen (sign up / log in) ----
  const authScreen = document.getElementById('authScreen');
  const tabSignup = document.getElementById('tabSignup');
  const tabLogin = document.getElementById('tabLogin');
  const signupForm = document.getElementById('signupForm');
  const loginForm = document.getElementById('loginForm');
  const suError = document.getElementById('suError');
  const liError = document.getElementById('liError');
  const switchText = document.getElementById('switchText');
  const switchBtn = document.getElementById('switchBtn');
  const guestBtn = document.getElementById('guestBtn');

  function showSignupTab(){
    tabSignup.classList.add('active');
    tabLogin.classList.remove('active');
    signupForm.style.display = 'flex';
    loginForm.style.display = 'none';
    switchText.textContent = 'Already have an account?';
    switchBtn.textContent = 'Log in';
    suError.textContent = '';
  }
  function showLoginTab(){
    tabLogin.classList.add('active');
    tabSignup.classList.remove('active');
    loginForm.style.display = 'flex';
    signupForm.style.display = 'none';
    switchText.textContent = "Don't have an account?";
    switchBtn.textContent = 'Sign up';
    liError.textContent = '';
  }

  tabSignup.addEventListener('click', showSignupTab);
  tabLogin.addEventListener('click', showLoginTab);
  switchBtn.addEventListener('click', () => {
    if(tabSignup.classList.contains('active')) showLoginTab();
    else showSignupTab();
  });

  let userEmail = '';
  let userPhone = '';
  let isVerified = false;
  let isGuest = true;
  let currentUser = null;
  let currentUserRef = null;
  let unsubUserDoc = null;

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function applyProfileData(name, data){
    if(name){
      const nameEl = document.getElementById('profileName');
      const handleEl = document.getElementById('profileHandle');
      nameEl.textContent = name;
      handleEl.textContent = '@' + name.toLowerCase().replace(/\s+/g, '.');
    }
    userPhone = (data && data.phone) || '';
    isVerified = !!(data && data.verified);
    wallet.coins = (data && typeof data.coins === 'number') ? data.coins : 0;
    wallet.watched = (data && typeof data.watched === 'number') ? data.watched : 0;
    refreshWallet();
    acctVerifyStatus.textContent = isVerified ? 'Verified' : 'Not Verified';
    acctVerifyStatus.classList.toggle('verified', isVerified);
  }

  function enterApp(displayName, contact){
    if(displayName){
      const nameEl = document.getElementById('profileName');
      const handleEl = document.getElementById('profileHandle');
      nameEl.textContent = displayName;
      handleEl.textContent = '@' + displayName.toLowerCase().replace(/\s+/g, '.');
    }
    if(contact) userEmail = contact;
    authScreen.classList.add('hide');
  }

  function watchUserDoc(uid){
    if(unsubUserDoc) unsubUserDoc();
    currentUserRef = doc(db, 'users', uid);
    unsubUserDoc = onSnapshot(currentUserRef, (snap) => {
      if(snap.exists()) applyProfileData(null, snap.data());
    });
  }

  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('suName').value.trim();
    const contact = document.getElementById('suContact').value.trim();
    const pass = document.getElementById('suPassword').value;
    const confirm = document.getElementById('suConfirm').value;

    if(!name || !contact || !pass || !confirm){
      suError.textContent = 'Please fill in all fields.';
      return;
    }
    if(!EMAIL_RE.test(contact)){
      suError.textContent = 'Please enter a valid email address (phone sign-up coming soon).';
      return;
    }
    if(pass.length < 4){
      suError.textContent = 'Password must be at least 4 characters.';
      return;
    }
    if(pass !== confirm){
      suError.textContent = 'Passwords do not match.';
      return;
    }

    suError.textContent = 'Creating your account…';
    try{
      const cred = await createUserWithEmailAndPassword(auth, contact, pass);
      await updateProfile(cred.user, { displayName: name });
      const userData = {
        name, email: contact, phone: '', verified: false,
        coins: 0, watched: 0, createdAt: serverTimestamp()
      };
      await setDoc(doc(db, 'users', cred.user.uid), userData);

      isGuest = false;
      currentUser = cred.user;
      applyProfileData(name, userData);
      watchUserDoc(cred.user.uid);
      suError.textContent = '';
      enterApp(name, contact);
    } catch(err){
      suError.textContent = firebaseErrorMessage(err);
    }
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const contact = document.getElementById('liContact').value.trim();
    const pass = document.getElementById('liPassword').value;

    if(!contact || !pass){
      liError.textContent = 'Please fill in all fields.';
      return;
    }
    if(!EMAIL_RE.test(contact)){
      liError.textContent = 'Please enter a valid email address.';
      return;
    }

    liError.textContent = 'Signing in…';
    try{
      const cred = await signInWithEmailAndPassword(auth, contact, pass);
      const snap = await getDoc(doc(db, 'users', cred.user.uid));
      const data = snap.exists() ? snap.data() : {};
      const name = data.name || cred.user.displayName || '';

      isGuest = false;
      currentUser = cred.user;
      applyProfileData(name, data);
      watchUserDoc(cred.user.uid);
      liError.textContent = '';
      enterApp(name, contact);
    } catch(err){
      liError.textContent = firebaseErrorMessage(err);
    }
  });

  function firebaseErrorMessage(err){
    const code = err && err.code ? err.code : '';
    if(code.includes('email-already-in-use')) return 'An account with this email already exists.';
    if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'Incorrect email or password.';
    if(code.includes('weak-password')) return 'Password is too weak (min 6 characters for Firebase).';
    if(code.includes('network-request-failed')) return 'Network error — please check your connection.';
    return 'Something went wrong. Please try again.';
  }

  guestBtn.addEventListener('click', () => {
    isGuest = true;
    currentUser = null;
    currentUserRef = null;
    if(unsubUserDoc){ unsubUserDoc(); unsubUserDoc = null; }
    enterApp(null);
  });

  // auto-resume a returning Firebase session (browser already signed in)
  let authStateChecked = false;
  onAuthStateChanged(auth, async (user) => {
    if(authStateChecked) return; // only auto-resume once, on initial load
    authStateChecked = true;
    if(user){
      try{
        const snap = await getDoc(doc(db, 'users', user.uid));
        const data = snap.exists() ? snap.data() : {};
        const name = data.name || user.displayName || '';
        isGuest = false;
        currentUser = user;
        applyProfileData(name, data);
        watchUserDoc(user.uid);
        enterApp(name, user.email);
      } catch(err){ /* stay on auth screen if this fails */ }
    }
  });

  // "Log Out" in settings returns to the auth screen
  document.querySelectorAll('.settings-item.danger').forEach(btn => {
    btn.addEventListener('click', async () => {
      settingsModal.classList.remove('show');
      if(!isGuest){
        try{ await signOut(auth); } catch(err){}
      }
      if(unsubUserDoc){ unsubUserDoc(); unsubUserDoc = null; }
      isGuest = true;
      currentUser = null;
      currentUserRef = null;
      userEmail = '';
      userPhone = '';
      isVerified = false;
      wallet.coins = 0;
      wallet.watched = 0;
      refreshWallet();
      acctVerifyStatus.textContent = 'Not Verified';
      acctVerifyStatus.classList.remove('verified');
      showHome();
      signupForm.reset();
      loginForm.reset();
      showSignupTab();
      authScreen.classList.remove('hide');
    });
  });

  // ---- search screen ----
  const searchScreen = document.getElementById('searchScreen');
  const searchOpenBtn = document.getElementById('searchOpenBtn');
  const searchCancelBtn = document.getElementById('searchCancelBtn');
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  function renderSearchResults(query){
    searchResults.innerHTML = '';
    const q = query.trim().toLowerCase();
    if(!q){
      searchResults.innerHTML = '<div class="search-empty">Search for a user or caption keyword</div>';
      return;
    }
    const matches = FEED_VIDEOS
      .map((v, i) => ({ v, i }))
      .filter(({v}) => v.user.toLowerCase().includes(q) || v.caption.toLowerCase().includes(q));

    if(matches.length === 0){
      searchResults.innerHTML = '<div class="search-empty">No results found</div>';
      return;
    }

    matches.forEach(({v, i}) => {
      const item = document.createElement('div');
      item.className = 'search-result-item';
      item.innerHTML = `
        <img src="${v.poster}" alt="${v.user}">
        <div class="search-result-text">
          <span class="search-result-user">@${v.user}</span>
          <span class="search-result-caption">${v.caption}</span>
        </div>
      `;
      item.addEventListener('click', () => {
        const targetSlide = firstSlideByVideo.get(v);
        if(targetSlide) targetSlide.scrollIntoView({ behavior: 'smooth' });
        closeSearch();
      });
      searchResults.appendChild(item);
    });
  }

  function openSearch(){
    searchScreen.classList.add('show');
    searchInput.value = '';
    renderSearchResults('');
    setTimeout(() => searchInput.focus(), 50);
  }
  function closeSearch(){
    searchScreen.classList.remove('show');
  }

  searchOpenBtn.addEventListener('click', openSearch);
  searchCancelBtn.addEventListener('click', closeSearch);
  searchInput.addEventListener('input', () => renderSearchResults(searchInput.value));

})();
</script>

</body>
</html>
